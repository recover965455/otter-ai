[package]
name = "otter-ai"
version = "0.1.3"
edition = "2021"
rust-version = "1.92"
description = "Unified LLM API with provider collections, automatic auth resolution, token and cost tracking, and context persistence"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/recover965455/otter-ai"
homepage = "https://github.com/recover965455/otter-ai"
documentation = "https://docs.rs/otter-ai"
keywords = ["llm", "ai", "gpt", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous", "web-programming"]
authors = ["Mega <recover965455@gmail.com>"]
exclude = [
    ".github/",
    "tests/",
    ".gitignore",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full", "rt", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
schemars = { version = "0.8", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
tokio-stream = "0.1"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["providers-openai", "providers-anthropic", "providers-faux"]

## Provider integrations

# Enable OpenAI-compatible provider (OpenAI, Azure OpenAI, etc.)
providers-openai = []

# Enable Anthropic provider (Claude models)
providers-anthropic = []

# Enable Faux provider (mock provider for testing)
providers-faux = []
