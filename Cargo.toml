[package]
name = "otter-ai"
version = "0.2.2"
edition = "2021"
rust-version = "1.92"
description = "Unified LLM API with provider collections, automatic auth resolution, token and cost tracking, and context persistence"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/recover965455/otter-ai"
homepage = "https://github.com/recover965455/otter-ai"
documentation = "https://docs.rs/otter-ai"
keywords = ["llm", "ai", "gpt", "openai", "anthropic"]
categories = ["api-bindings", "asynchronous", "web-programming"]
authors = ["Mega <recover965455@gmail.com>"]
exclude = [
    ".github/",
    "tests/",
    ".gitignore",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full", "rt", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
schemars = { version = "0.8", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
tokio-stream = "0.1"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
parking_lot = "0.12"
tracing = "0.1"
rand = "0.8"
hex = "0.4"
http = { version = "1", optional = true }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
zstd = { version = "0.13", optional = true }
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tokio-tungstenite = { version = "0.21", default-features = false }

[features]
default = [
    "providers-openai",
    "providers-anthropic",
    "providers-faux",
    "providers-ant-ling",
    "providers-azure",
    "providers-baseten",
    "providers-bedrock",
    "providers-cerebras",
    "providers-chatgpt-plus",
    "providers-claude-pro-max",
    "providers-cloudflare-ai-gateway",
    "providers-cloudflare-workers-ai",
    "providers-deepseek",
    "providers-fireworks",
    "providers-github-copilot",
    "providers-google",
    "providers-google-vertex",
    "providers-groq",
    "providers-mistral",
    "providers-moonshot",
    "providers-nvidia",
    "providers-openrouter",
    "providers-openrouter-oauth",
    "providers-qwen-token-plan",
    "providers-radius",
    "providers-vercel-ai-gateway",
    "providers-xai",
    "providers-xai-subscription",
    "providers-zai",
    "codex-websocket",
    "codex-zstd",
]

## Provider integrations
##
## Default: every public provider (same as `@earendil-works/pi-ai` which ships
## all backends).  Disable default-features and cherry-pick to shrink compile
## time if you only need a subset.

# Enable OpenAI-compatible provider (OpenAI, Azure OpenAI, etc.)
providers-openai = []
# Enable Anthropic provider (Claude models)
providers-anthropic = []
# Enable Faux provider (mock provider for testing)
providers-faux = []
# Enable Azure OpenAI (Responses API flavour).
providers-azure = []
# Enable Amazon Bedrock (ConverseStream protocol + bearer auth).
providers-bedrock = []
# Enable Cerebras ultra-fast inference provider.
providers-cerebras = []
# Enable Cloudflare AI Gateway proxy.
providers-cloudflare-ai-gateway = []
# Enable Cloudflare Workers AI edge inference provider.
providers-cloudflare-workers-ai = []
# Enable DeepSeek (chat + reasoner).
providers-deepseek = []
# Enable Google Generative AI (Gemini family).
providers-google = []
# Enable Groq ultra-fast inference.
providers-groq = []
# Enable Mistral / Codestral provider.
providers-mistral = []
# Enable NVIDIA NIM inference.
providers-nvidia = []
# Enable OpenRouter aggregator (auto-sends Referer + X-Title headers).
providers-openrouter = []
# Enable Vercel AI Gateway proxy.
providers-vercel-ai-gateway = []
# Enable xAI (Grok) provider.
providers-xai = []
# Enable ZAI / Codin provider.
providers-zai = []
# Enable Ant Ling (Ant Group coding assistant).
providers-ant-ling = []
# Enable Baseten managed inference.
providers-baseten = []
# Enable ChatGPT Plus/Pro (Codex) subscription OAuth provider.
providers-chatgpt-plus = []
# Enable Claude Pro/Max subscription OAuth provider.
providers-claude-pro-max = []
# Enable Fireworks AI inference.
providers-fireworks = []
# Enable GitHub Copilot subscription OAuth provider (device-code flow).
providers-github-copilot = []
# Enable Google Vertex AI (enterprise Google Cloud LLM).
providers-google-vertex = []
# Enable Moonshot AI / Kimi Coding.
providers-moonshot = []
# Enable OpenRouter OAuth (PKCE, mints user-controlled API key).
providers-openrouter-oauth = []
# Enable Qwen Token Plan Individual.
providers-qwen-token-plan = []
# Enable Radius (pi-messages gateway).
providers-radius = []
# Enable xAI subscription (Grok/X subscription, device OAuth).
providers-xai-subscription = []
# Enable the Codex WebSocket transport (`transport: "auto"` prefers it and
# falls back to SSE). Adds tokio-tungstenite + http.
codex-websocket = ["dep:tokio-tungstenite", "dep:http"]
codex-zstd = ["dep:zstd"]
