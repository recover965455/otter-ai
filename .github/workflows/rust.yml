name: Rust CI & Publish

# Toolchain policy (aligns with Cargo.toml `rust-version`):
# - CI compiles with the latest Rust stable so developers get the newest
#   Clippy lints and optimizations (CI runners have reached rust-1.97.0).
# - The minimum supported Rust version (MSRV) declared in Cargo.toml is
#   the oldest toolchain this crate is *guaranteed* to compile on for
#   downstream consumers. CI uses stable; bump rust-version in Cargo.toml
#   if a newer language/library feature is adopted.
#
# Release checklist (enforced by CI):
#   1. `scripts/sync_readme_version.sh --check` passes
#      → README marker block + MSRV line + dep version prefix all match
#         Cargo.toml `version` / `rust-version`.
#      This is a HARD check on every push (no auto-push from CI: the
#      default GITHUB_TOKEN cannot push to main). Keep README in sync
#      locally with `.githooks/pre-commit` (bash scripts/install_hooks.sh)
#      or `scripts/release.sh` which runs the sync as part of the bump.
#   2. fmt / clippy / build / test
#   3. cargo package → cargo publish (only on push to main, and only if
#      secrets.CARGO_REGISTRY_TOKEN is configured; the Cargo.toml version
#      is pre-checked against crates.io so an already-published version
#      fails fast with a clear message)

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  readme-version-sync:
    name: README ↔ Cargo.toml version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the follow-up commit push (if any) lands on `main`
          # with the correct author/token.
          persist-credentials: false

      - name: Check README sync (PR / dry-run mode)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/sync_readme_version.sh
          bash scripts/sync_readme_version.sh apply
          echo "--- diff after apply ---"
          git --no-pager diff -- README.md || true
          bash scripts/sync_readme_version.sh --check

      - name: Hard check README sync on push(main)
        # No auto-push from CI: the default GITHUB_TOKEN cannot push to
        # main (403 "denied to github-actions[bot]"). Instead fail loudly
        # so the drift is fixed locally (hooks / release script) and the
        # fix lands in the same commit as the version bump.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          chmod +x scripts/sync_readme_version.sh
          if bash scripts/sync_readme_version.sh --check >/dev/null 2>&1; then
            echo "✅ README.md in sync with Cargo.toml; nothing to do."
            exit 0
          fi
          echo "❌ README.md drifted from Cargo.toml (version/MSRV markers)."
          echo "   Fix locally and include the README change in the bump commit:"
          echo ""
          echo "     bash scripts/sync_readme_version.sh"
          echo "     bash scripts/install_hooks.sh   # prevents this in the future"
          echo "     git add README.md && git commit --amend --no-edit"
          echo "     git push --force-with-lease"
          echo ""
          exit 1

  build-and-test:
    name: Build & Test (stable)
    needs: readme-version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # If the sync job just pushed a README commit, we need the very
          # latest HEAD so the publish job below packages a crate whose
          # README already shows the right version.
          ref: ${{ github.sha }}

      - name: Install Rust stable (latest, matches CI "stable" policy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (stable, warnings -> errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose --all-features

      - name: Run tests
        run: cargo test --verbose --all-features

  publish:
    name: Publish to crates.io
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check version and skip if already published
        # `cargo publish` fails with a confusing "already exists" error when
        # the version was already released; publishing is idempotent, so we
        # pre-check crates.io and skip gracefully instead of failing.
        id: publish-check
        run: |
          set -euo pipefail
          VERSION="$(awk -v k=version '/^\[package\]/{p=1;next} /^\[/{p=0} p && match($0,"^[[:space:]]*" k "[[:space:]]*=[[:space:]]*\"[^\"]+\""){line=$0;sub(/^[^\"]*\"/,"",line);sub(/\"[^\"]*$/,"",line);print line;exit}' Cargo.toml 2>/dev/null)"
          LATEST="$(curl -sL "https://crates.io/api/v1/crates/otter-ai" -H "User-Agent: otter-ai-ci" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('crate',{}).get('max_version',''))" 2>/dev/null || true)"
          if [[ "$VERSION" == "$LATEST" && -n "$LATEST" ]]; then
            echo "✅ otter-ai@$VERSION is already on crates.io; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "✅ $VERSION not yet on crates.io (latest: ${LATEST:-unknown})"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Verify package (cargo package)
        if: steps.publish-check.outputs.should_publish == 'true'
        run: cargo package --verbose --allow-dirty

      - name: Publish to crates.io
        if: steps.publish-check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --verbose --allow-dirty
