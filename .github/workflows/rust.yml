name: Rust CI & Publish

# Toolchain policy (aligns with Cargo.toml `rust-version`):
# - CI compiles with the latest Rust stable so developers get the newest
#   Clippy lints and optimizations (CI runners have reached rust-1.97.0).
# - The minimum supported Rust version (MSRV) declared in Cargo.toml is
#   the oldest toolchain this crate is *guaranteed* to compile on for
#   downstream consumers. CI uses stable; bump rust-version in Cargo.toml
#   if a newer language/library feature is adopted.
#
# Release checklist (enforced by CI):
#   1. `scripts/sync_readme_version.sh --check` passes
#      → README marker block + MSRV line + dep version prefix all match
#         Cargo.toml `version` / `rust-version`.
#      If this fails on `push main`, CI auto-fixes README and pushes a
#      follow-up commit on your behalf, so crates.io metadata and the
#      README stay in lockstep.
#   2. fmt / clippy / build / test
#   3. cargo package → cargo publish (only on push to main, and only if
#      secrets.CARGO_REGISTRY_TOKEN is configured)

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  readme-version-sync:
    name: README ↔ Cargo.toml version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the follow-up commit push (if any) lands on `main`
          # with the correct author/token.
          persist-credentials: false

      - name: Check README sync (PR / dry-run mode)
        if: github.event_name == 'pull_request'
        run: |
          chmod +x scripts/sync_readme_version.sh
          bash scripts/sync_readme_version.sh apply
          echo "--- diff after apply ---"
          git --no-pager diff -- README.md || true
          bash scripts/sync_readme_version.sh --check

      - name: Apply README sync + auto-push on push(main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # Either a PAT with `workflow` + `repo` scopes stored as a repo
          # secret, OR fall back to the default GITHUB_TOKEN.
          # GITHUB_TOKEN can push to main but CANNOT update workflow files
          # under .github/workflows, which is fine because this commit only
          # touches README.md.
          PUSH_TOKEN: ${{ secrets.README_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync_readme_version.sh
          bash scripts/sync_readme_version.sh apply

          if git diff --quiet -- README.md; then
            echo "✅ README.md already in sync with Cargo.toml; nothing to push."
            exit 0
          fi

          echo "📝 README.md drifted from Cargo.toml; committing follow-up fix"
          git --no-pager diff -- README.md

          # Authenticate git with the chosen token.
          remote_auth="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "$remote_auth"
          git config user.name  "otter-ai-bot"
          git config user.email "bot@users.noreply.github.com"

          VERSION="$(awk '/^\[package\]/,/^\[/ { if ($0 ~ /^version[[:space:]]*=/) { gsub(/.*"([^"]+)".*/,"\\1",$0); print; exit } }' Cargo.toml)"
          MSRV="$(   awk '/^\[package\]/,/^\[/ { if ($0 ~ /^rust-version[[:space:]]*=/) { gsub(/.*"([^"]+)".*/,"\\1",$0); print; exit } }' Cargo.toml)"

          git add README.md
          git commit -m "docs(readme): sync version markers to Cargo.toml v${VERSION} / MSRV ${MSRV}

Automated follow-up commit generated by .github/workflows/rust.yml
job readme-version-sync: scripts/sync_readme_version.sh applied."

          echo "⬆️  Pushing README sync commit to ${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-and-test:
    name: Build & Test (stable)
    needs: readme-version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # If the sync job just pushed a README commit, we need the very
          # latest HEAD so the publish job below packages a crate whose
          # README already shows the right version.
          ref: ${{ github.sha }}

      - name: Install Rust stable (latest, matches CI "stable" policy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (stable, warnings -> errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose --all-features

      - name: Run tests
        run: cargo test --verbose --all-features

  publish:
    name: Publish to crates.io
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify package (cargo package)
        run: cargo package --verbose --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --verbose --allow-dirty
