[package]
name = "pi-ai-rs"
version = "0.1.0"
edition = "2021"
description = "Unified LLM API with provider collections, automatic auth resolution, token and cost tracking"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full", "rt", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
schemars = { version = "0.8", features = ["derive"] }
validator = { version = "0.20", features = ["derive"] }
tokio-stream = "0.1"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-stream = "0.3"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["providers-openai", "providers-anthropic", "providers-faux"]
providers-openai = []
providers-anthropic = []
providers-faux = []
